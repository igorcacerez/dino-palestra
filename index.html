<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jogo do Dino</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    canvas { background: #a0e0ff; display: block; margin: auto; }
  </style>
</head>
<body>
  <canvas id="gameCanvas" width="600" height="400"></canvas>
  <audio id="collectSound" src="assets/collect.mp3"></audio>
  <audio id="hitSound" src="assets/hit.mp3"></audio>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    const dino = { x: 280, y: 340, width: 40, height: 40, speed: 5, mouthOpen: false };
    let fruits = [];
    let meteors = [];
    let score = 0;
    let lives = 3;

    const keys = {};
    document.addEventListener("keydown", (e) => keys[e.key] = true);
    document.addEventListener("keyup", (e) => keys[e.key] = false);

    const dinoNormal = new Image();
    dinoNormal.src = "assets/dino_normal.png"; // imagem olhando pra cima
    const dinoOpen = new Image();
    dinoOpen.src = "assets/dino_open.png"; // imagem com a boca aberta

    const heartImg = new Image();
    heartImg.src = "assets/heart.png";
    const fruitImg = new Image();
    fruitImg.src = "assets/fruit.png";
    const meteorImg = new Image();
    meteorImg.src = "assets/meteor.png";

    const collectSound = document.getElementById("collectSound");
    const hitSound = document.getElementById("hitSound");

    function drawDino() {
      const image = dino.mouthOpen ? dinoOpen : dinoNormal;
      ctx.drawImage(image, dino.x, dino.y, dino.width, dino.height);
    }

    function drawFruits() {
      fruits.forEach(fruit => {
        ctx.drawImage(fruitImg, fruit.x - 10, fruit.y - 10, 20, 20);
      });
    }

    function drawMeteors() {
      meteors.forEach(meteor => {
        ctx.drawImage(meteorImg, meteor.x - 12, meteor.y - 12, 24, 24);
      });
    }

    function moveDino() {
      if (keys["ArrowLeft"] && dino.x > 0) dino.x -= dino.speed;
      if (keys["ArrowRight"] && dino.x + dino.width < canvas.width) dino.x += dino.speed;
    }

    function spawnItems() {
      if (Math.random() < 0.02) fruits.push({ x: Math.random() * 580 + 10, y: 0 });
      if (Math.random() < 0.015) meteors.push({ x: Math.random() * 580 + 10, y: 0 });
    }

    function updateItems() {
      fruits.forEach(fruit => fruit.y += 2);
      meteors.forEach(meteor => meteor.y += 3);

      fruits = fruits.filter(fruit => fruit.y < 400);
      meteors = meteors.filter(meteor => meteor.y < 400);
    }

    function checkCollisions() {
      let near = false;
      fruits = fruits.filter(fruit => {
        const collision = fruit.x > dino.x && fruit.x < dino.x + dino.width &&
                          fruit.y > dino.y && fruit.y < dino.y + dino.height;
        const close = Math.abs(fruit.x - dino.x) < 40 && Math.abs(fruit.y - dino.y) < 40;
        if (collision) {
          score++;
          collectSound.currentTime = 0;
          collectSound.play();
          return false;
        }
        if (close) near = true;
        return true;
      });

      meteors = meteors.filter(meteor => {
        const collision = meteor.x > dino.x && meteor.x < dino.x + dino.width &&
                          meteor.y > dino.y && meteor.y < dino.y + dino.height;
        const close = Math.abs(meteor.x - dino.x) < 40 && Math.abs(meteor.y - dino.y) < 40;
        if (collision) {
          lives--;
          hitSound.currentTime = 0;
          hitSound.play();
          return false;
        }
        if (close) near = true;
        return true;
      });

      dino.mouthOpen = near;
    }

    function drawUI() {
      ctx.fillStyle = "#000";
      ctx.font = "16px Arial";
      ctx.fillText("Pontos: " + score, 10, 20);
      ctx.fillText("Vidas: " + lives, 10, 40);
    }

    function gameLoop() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      moveDino();
      spawnItems();
      updateItems();
      checkCollisions();
      drawDino();
      drawFruits();
      drawMeteors();
      drawUI();

      if (lives > 0) requestAnimationFrame(gameLoop);
      else alert("Game Over! Pontos: " + score);
    }

    gameLoop();
  </script>
</body>
</html>
