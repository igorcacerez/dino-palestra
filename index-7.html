<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jogo do Dino</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; font-family: Arial, sans-serif; }
    canvas { display: none; }
    #startScreen, #gameOverScreen {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: black;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 10;
    }
    #gameOverScreen { display: none; }
    #introVideo {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }
    #startButton {
      display: none;
      padding: 12px 24px;
      font-size: 1.5em;
      background-color: white;
      color: black;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      animation: pulse 1s infinite;
      z-index: 1;
    }
    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }
    button:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div id="startScreen">
    <video id="introVideo" src="assets/intro.mp4" playsinline></video>
    <button id="startButton">Jogar</button>
  </div>

  <div id="gameOverScreen">
    <h1>Você perdeu!</h1>
    <button id="restartButton">Reiniciar Jogo</button>
  </div>

  <canvas id="gameCanvas"></canvas>
  <audio id="collectSound" src="assets/collect.mp3"></audio>
  <audio id="hitSound" src="assets/hit.mp3"></audio>

  <script>
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const startScreen = document.getElementById("startScreen");
    const startButton = document.getElementById("startButton");
    const introVideo = document.getElementById("introVideo");
    const gameOverScreen = document.getElementById("gameOverScreen");
    const restartButton = document.getElementById("restartButton");

    const bgm = new Audio("assets/background.mp3");
    bgm.loop = true;
    bgm.volume = 0.5;

    const backgroundImg = new Image();
    backgroundImg.src = "assets/background.jpg";

    const heartImg = new Image();
    heartImg.src = "assets/heart.png";

    let videoPlayed = false;

    window.addEventListener("click", () => {
      if (!videoPlayed) {
        introVideo.muted = false;
        introVideo.volume = 1.0;
        introVideo.play();
        videoPlayed = true;
      }
    });

    introVideo.onended = () => {
      startButton.style.display = "block";
    };

    startButton.onclick = () => {
      introVideo.pause();
      introVideo.currentTime = 0;
      startScreen.style.display = "none";
      canvas.style.display = "block";
      bgm.play();
      initGame();
    };

    restartButton.onclick = () => {
      location.reload();
    };

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    let dino, fruits, meteors, score, lives, gameTicks;
    let keys = {};
    document.addEventListener("keydown", e => keys[e.key] = true);
    document.addEventListener("keyup", e => keys[e.key] = false);

    const dinoNormal = new Image();
    dinoNormal.src = "assets/dino_normal.png";
    const dinoOpen = new Image();
    dinoOpen.src = "assets/dino_open.png";
    const fruitImg = new Image();
    fruitImg.src = "assets/fruit.png";
    const meteorImg = new Image();
    meteorImg.src = "assets/meteor.png";

    const collectSound = document.getElementById("collectSound");
    const hitSound = document.getElementById("hitSound");

    function initGame() {
      dino = {
        x: canvas.width / 2 - 106,
        y: canvas.height - 60 - 146.5,
        width: 106.5,
        height: 146.5,
        speed: 5,
        mouthOpen: false,
        facingLeft: false
      };
      fruits = [];
      meteors = [];
      score = 0;
      lives = 3;
      gameTicks = 0;
      requestAnimationFrame(gameLoop);
    }

    function drawBackground() {
      ctx.drawImage(backgroundImg, 0, 0, canvas.width, canvas.height);
    }

    function drawDino() {
      const image = dino.mouthOpen ? dinoOpen : dinoNormal;
      ctx.save();
      if (dino.facingLeft) {
        ctx.translate(dino.x + dino.width / 2, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(image, -dino.width / 2, dino.y, dino.width, dino.height);
      } else {
        ctx.drawImage(image, dino.x, dino.y, dino.width, dino.height);
      }
      ctx.restore();
    }

    function drawFruits() {
      fruits.forEach(fruit => {
        ctx.drawImage(fruitImg, fruit.x - 23, fruit.y - 26.5, 46, 53);
      });
    }

    function drawMeteors() {
      meteors.forEach(meteor => {
        ctx.drawImage(meteorImg, meteor.x - 37.5, meteor.y - 43.75, 75, 87.5);
      });
    }

    function drawUI() {
      ctx.fillStyle = "#fff";
      ctx.font = "bold 24px 'Segoe UI', sans-serif";
      ctx.fillText("Pontos: " + score, 10, 30);

      const spacing = 10;
      const heartSize = 30;
      for (let i = 0; i < lives; i++) {
        ctx.drawImage(heartImg, canvas.width - (heartSize + spacing) * (i + 1), 10, heartSize, heartSize);
      }
    }

    function moveDino() {
      if (keys["ArrowLeft"] && dino.x > 0) {
        dino.x -= dino.speed;
        dino.facingLeft = true;
      }
      if (keys["ArrowRight"] && dino.x + dino.width < canvas.width) {
        dino.x += dino.speed;
        dino.facingLeft = false;
      }
    }

    function spawnItems() {
      const fruitChance = 0.02 + Math.min(gameTicks / 10000, 0.03);
      const maxFruits = 5 + Math.floor(score / 20);
      const maxMeteors = 1 + Math.floor(score / 50);

      if (fruits.length < maxFruits && Math.random() < fruitChance) {
        fruits.push({ x: Math.random() * (canvas.width - 46) + 23, y: 0 });
      }

      if (meteors.length < maxMeteors) {
        meteors.push({ x: Math.random() * (canvas.width - 75) + 37.5, y: 0 });
      }
    }

    function updateItems() {
      const fruitSpeed = 2 + Math.min(gameTicks / 1000, 5);
      const meteorSpeed = 3 + Math.min(gameTicks / 1000, 6);

      fruits.forEach(fruit => fruit.y += fruitSpeed);
      meteors.forEach(meteor => meteor.y += meteorSpeed);

      fruits = fruits.filter(fruit => fruit.y < canvas.height);
      meteors = meteors.filter(meteor => meteor.y < canvas.height);
    }

    function checkCollisions() {
      let near = false;
      fruits = fruits.filter(fruit => {
        const collision = fruit.x > dino.x && fruit.x < dino.x + dino.width &&
                          fruit.y > dino.y && fruit.y < dino.y + dino.height;
        const close = Math.abs(fruit.x - dino.x) < 75 && Math.abs(fruit.y - dino.y) < 75;
        if (collision) {
          score++;
          collectSound.currentTime = 0;
          collectSound.play();
          return false;
        }
        if (close) near = true;
        return true;
      });

      meteors = meteors.filter(meteor => {
        const collision = meteor.x > dino.x && meteor.x < dino.x + dino.width &&
                          meteor.y > dino.y && meteor.y < dino.y + dino.height;
        const close = Math.abs(meteor.x - dino.x) < 75 && Math.abs(meteor.y - dino.y) < 75;
        if (collision) {
          lives--;
          hitSound.currentTime = 0;
          hitSound.play();
          return false;
        }
        if (close) near = true;
        return true;
      });

      dino.mouthOpen = near;
    }

    function gameLoop() {
      gameTicks++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawBackground();
      moveDino();
      spawnItems();
      updateItems();
      checkCollisions();
      drawDino();
      drawFruits();
      drawMeteors();
      drawUI();

      if (lives > 0) {
        requestAnimationFrame(gameLoop);
      } else {
        canvas.style.display = "none";
        gameOverScreen.style.display = "flex";
        bgm.pause();
      }
    }
  </script>
</body>
</html>
